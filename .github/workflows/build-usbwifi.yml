name: 测试版 USB 无线网卡 (xg-040g-md)

# 独立测试流程：只编 xg-040g-md，在标准固件上开启内核 WLAN 子系统
# 并加入 USB 无线网卡驱动，用于插 USB 网卡发射 WiFi。
# 不影响 build.yml / build-extra.yml 的正式构建。

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firmware-usbwifi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: xg-040g-md + USB WiFi
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: 检出本仓库（配置与脚本）
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: 安装编译依赖
        run: |
          PKGS="build-essential clang flex bison g++ gawk gcc-multilib g++-multilib
                gettext git libncurses-dev libssl-dev python3 python3-dev
                python3-setuptools rsync swig unzip zlib1g-dev file wget curl
                libtool-bin libelf-dev device-tree-compiler ccache
                libglib2.0-dev libpixman-1-dev intltool quilt ecj fastjar"
          OPTS="-y --no-install-recommends -o Acquire::Retries=8 -o Acquire::http::Timeout=120 -o Acquire::https::Timeout=120"
          sudo apt-get update -o Acquire::Retries=8 || true
          for i in 1 2 3 4; do
            if sudo apt-get install $OPTS $PKGS; then
              echo "依赖安装成功（第 $i 次尝试）"
              exit 0
            fi
            echo "::warning::第 $i 次安装依赖失败，切换镜像源后重试"
            sudo sed -i -E 's#https?://(azure\.)?archive\.ubuntu\.com#http://archive.ubuntu.com#g; s#https?://security\.ubuntu\.com#http://security.ubuntu.com#g' \
              /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true
            sleep 20
            sudo apt-get update -o Acquire::Retries=8 || true
          done
          echo "::error::依赖安装连续 4 次失败"
          exit 1

      - name: 准备源码 / feeds / 定制 / 配置（USB WiFi）
        env:
          SEED_FILE: ${{ github.workspace }}/config/seed-usbwifi.config
          KERNEL_WLAN: "1"
          EXTRA_REQUIRED_PKGS: "kmod-mac80211 kmod-cfg80211 wpad-mbedtls kmod-mt7921u kmod-usb3"
        run: bash scripts/prepare.sh xg-040g-md nokia_xg-040g-md-ubi

      - name: 下载并编译
        run: bash scripts/build.sh xg-040g-md nokia_xg-040g-md-ubi

      - name: 标记为测试版
        run: |
          cd output/xg-040g-md
          for f in *.itb; do
            [ -e "$f" ] && mv -v "$f" "${f%.itb}-usbtest.itb"
          done
          for f in *-BUILD-INFO.txt; do
            [ -e "$f" ] || continue
            case "$f" in *usbtest*) continue ;; esac
            mv -v "$f" "${f%-BUILD-INFO.txt}-usbtest-BUILD-INFO.txt"
          done
          {
            echo "版本类型: 测试版（USB 无线网卡）"
            echo "改动:     内核开启 CONFIG_WLAN，加入 mt76/rtw88/ath9k_htc 驱动与 wpad-mbedtls"
            echo "用法:     插入 USB 网卡后，LuCI -> 网络 -> 无线 中创建 AP"
          } >> ./*-usbtest-BUILD-INFO.txt
          ls -lh

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: firmware-usbtest-xg-040g-md
          path: output/xg-040g-md/
          if-no-files-found: error
          retention-days: 90

      - name: 上传完整编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-usbtest-xg-040g-md
          path: build-xg-040g-md.log
          if-no-files-found: ignore
          retention-days: 30

  publish:
    name: 发布测试版固件
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: 下载固件
        uses: actions/download-artifact@v4
        with:
          name: firmware-usbtest-xg-040g-md
          path: dist

      - name: 列出待发布文件
        run: find dist -type f -printf '%s  %p\n' | sort -k2

      - name: 创建预发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="usbtest-$(date +%Y%m%d-%H%M%S)-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "USB 无线网卡测试版 ${GITHUB_RUN_NUMBER}" \
            --prerelease \
            --notes "测试版，仅 xg-040g-md。内核已开启 WLAN 子系统，内置 mt76 / rtw88 / ath9k_htc USB 无线驱动与 wpad-mbedtls，用于插 USB 网卡发射 WiFi。非正式版，请勿用于长期使用。" || true
