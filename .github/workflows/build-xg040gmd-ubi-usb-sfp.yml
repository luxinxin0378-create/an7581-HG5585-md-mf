name: 构建 XG-040G-MD UBI-USB-SFP 固件

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-xg040gmd-ubi-usb-sfp.yml"

permissions:
  contents: read

concurrency:
  group: xg040gmd-ubi-usb-sfp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: xg-040g-md-ubi-usb-sfp
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      FORCE_UNSAFE_CONFIGURE: "1"
      MODEL: xg-040g-md-ubi-usb-sfp
      PROFILE: nokia_xg-040g-md-ubi-usb-sfp
    steps:
      - name: 检出本仓库（配置与脚本）
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: 安装编译依赖
        run: |
          PKGS="build-essential clang flex bison g++ gawk gcc-multilib g++-multilib
                gettext git libncurses-dev libssl-dev python3 python3-dev
                python3-setuptools rsync swig unzip zlib1g-dev file wget curl
                libtool-bin libelf-dev device-tree-compiler ccache
                libglib2.0-dev libpixman-1-dev intltool quilt ecj fastjar"
          OPTS="-y --no-install-recommends -o Acquire::Retries=8 -o Acquire::http::Timeout=120 -o Acquire::https::Timeout=120"
          sudo apt-get update -o Acquire::Retries=8 || true
          for i in 1 2 3 4; do
            if sudo apt-get install $OPTS $PKGS; then
              echo "依赖安装成功（第 $i 次尝试）"
              exit 0
            fi
            echo "::warning::第 $i 次安装依赖失败，切换镜像源后重试"
            sudo sed -i -E 's#https?://(azure\.)?archive\.ubuntu\.com#http://archive.ubuntu.com#g; s#https?://security\.ubuntu\.com#http://security.ubuntu.com#g' \
              /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true
            sleep 20
            sudo apt-get update -o Acquire::Retries=8 || true
          done
          echo "::error::依赖安装连续 4 次失败"
          exit 1

      - name: 恢复源码包缓存（dl）
        uses: actions/cache@v4
        with:
          path: cache/dl
          key: dl-v1
          restore-keys: |
            dl-

      - name: 恢复编译缓存（ccache）
        uses: actions/cache@v4
        with:
          path: cache/ccache
          key: ccache-${{ env.MODEL }}-${{ hashFiles('config/**', 'scripts/**') }}
          restore-keys: |
            ccache-${{ env.MODEL }}-

      - name: 限制 ccache 体积
        run: |
          export CCACHE_DIR="$PWD/cache/ccache"
          mkdir -p "$CCACHE_DIR"
          ccache -M 2G >/dev/null 2>&1 || true
          ccache -s 2>/dev/null | head -10 || true

      - name: 准备 UBI-USB-SFP 配置
        run: |
          bash scripts/prepare.sh "$MODEL" "$PROFILE"
          grep -Fq "CONFIG_TARGET_airoha_an7581_DEVICE_$PROFILE=y" ponwrt/.config

      - name: 下载并编译 UBI-USB-SFP 固件
        run: bash scripts/build.sh "$MODEL" "$PROFILE"

      - name: 上传 UBI-USB-SFP 固件
        uses: actions/upload-artifact@v4
        with:
          name: firmware-xg-040g-md-ubi-usb-sfp
          path: output/xg-040g-md-ubi-usb-sfp/
          if-no-files-found: error
          retention-days: 90

      - name: 上传完整编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-xg-040g-md-ubi-usb-sfp
          path: build-xg-040g-md-ubi-usb-sfp.log
          if-no-files-found: ignore
          retention-days: 30
