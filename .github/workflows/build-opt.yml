name: 构建优化版（不含 Vantage）

# 纯优化版：BBR / RPS-RFS / WiFi 监管域 / ccache 全保留，
# 但不内置 Vantage 主题与看板，默认主题回到 Argon。
# 独立并发组，可与正式版（含 Vantage）同时跑，互不排队。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firmware-opt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: opt-${{ matrix.model }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: hg5585f-ct
            profile: fiberhome_hg5585f-ct
            subtarget: an7581
          - model: xg-040g-md
            profile: nokia_xg-040g-md-ubi
            subtarget: an7581
          - model: hg5585f-cu
            profile: fiberhome_hg5585f-cu
            subtarget: an7581
          - model: xg-040g-mf
            profile: nokia_xg-040g-mf-ubi
            subtarget: an7583
    env:
      FORCE_UNSAFE_CONFIGURE: "1"
      WITH_VANTAGE: "0"
    steps:
      - name: 检出本仓库（配置与脚本）
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: 安装编译依赖
        run: |
          PKGS="build-essential clang flex bison g++ gawk gcc-multilib g++-multilib
                gettext git libncurses-dev libssl-dev python3 python3-dev
                python3-setuptools rsync swig unzip zlib1g-dev file wget curl
                libtool-bin libelf-dev device-tree-compiler ccache
                libglib2.0-dev libpixman-1-dev intltool quilt ecj fastjar"
          OPTS="-y --no-install-recommends -o Acquire::Retries=8 -o Acquire::http::Timeout=120 -o Acquire::https::Timeout=120"
          sudo apt-get update -o Acquire::Retries=8 || true
          for i in 1 2 3 4; do
            if sudo apt-get install $OPTS $PKGS; then
              echo "依赖安装成功（第 $i 次尝试）"
              exit 0
            fi
            echo "::warning::第 $i 次安装依赖失败，切换镜像源后重试"
            sudo sed -i -E 's#https?://(azure\.)?archive\.ubuntu\.com#http://archive.ubuntu.com#g; s#https?://security\.ubuntu\.com#http://security.ubuntu.com#g' \
              /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true
            sleep 20
            sudo apt-get update -o Acquire::Retries=8 || true
          done
          echo "::error::依赖安装连续 4 次失败"
          exit 1

      - name: 恢复源码包缓存（dl）
        uses: actions/cache@v4
        with:
          path: cache/dl
          key: dl-v1
          restore-keys: |
            dl-

      - name: 恢复编译缓存（ccache）
        uses: actions/cache@v4
        with:
          path: cache/ccache
          key: ccache-opt-${{ matrix.model }}-${{ hashFiles('config/**', 'scripts/**', 'extra/**') }}
          restore-keys: |
            ccache-${{ matrix.model }}-
            ccache-opt-${{ matrix.model }}-

      - name: 限制 ccache 体积
        run: |
          export CCACHE_DIR="$PWD/cache/ccache"
          mkdir -p "$CCACHE_DIR"
          ccache -M 2G >/dev/null 2>&1 || true
          ccache -s 2>/dev/null | head -10 || true

      - name: 准备源码 / feeds / 定制 / 配置
        run: |
          case "${{ matrix.model }}" in
            hg5585f-cu|xg-040g-mf)
              bash extra/prepare-extra.sh "${{ matrix.model }}" "${{ matrix.profile }}" "${{ matrix.subtarget }}"
              ;;
            *)
              bash scripts/prepare.sh "${{ matrix.model }}" "${{ matrix.profile }}"
              ;;
          esac

      - name: 下载并编译
        run: |
          case "${{ matrix.model }}" in
            hg5585f-cu|xg-040g-mf)
              bash extra/build-extra.sh "${{ matrix.model }}" "${{ matrix.profile }}" "${{ matrix.subtarget }}"
              ;;
            *)
              bash scripts/build.sh "${{ matrix.model }}" "${{ matrix.profile }}"
              ;;
          esac

      - name: 标记为无 Vantage 版
        run: |
          cd "output/${{ matrix.model }}"
          for f in *.itb; do
            [ -e "$f" ] && mv -v "$f" "${f%.itb}-novantage.itb"
          done
          for f in *-BUILD-INFO.txt; do
            [ -e "$f" ] || continue
            case "$f" in *novantage*) continue ;; esac
            mv -v "$f" "${f%-BUILD-INFO.txt}-novantage-BUILD-INFO.txt"
          done
          {
            echo "版本类型: 纯优化版（不含 Vantage 主题与看板，默认 Argon）"
            echo "包含:     BBR / RPS-RFS / WiFi 监管域 / ccache 构建缓存"
          } >> ./*-novantage-BUILD-INFO.txt
          ls -lh

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: fw-opt-${{ matrix.model }}
          path: output/${{ matrix.model }}/
          if-no-files-found: error
          retention-days: 90

      - name: 上传完整编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-opt-${{ matrix.model }}
          path: build-${{ matrix.model }}.log
          if-no-files-found: ignore
          retention-days: 30

  publish:
    name: 汇总发布优化版
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: 下载四个机型的固件
        uses: actions/download-artifact@v4
        with:
          pattern: fw-opt-*
          path: dist
          merge-multiple: true

      - name: 列出待发布文件
        run: find dist -type f -printf '%s  %p\n' | sort -k2

      - name: 创建 Release 并上传固件
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="fw-opt-$(date +%Y%m%d-%H%M%S)-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "优化版固件（无 Vantage）${GITHUB_RUN_NUMBER}" \
            --notes "机型：hg5585f-ct / xg-040g-md / hg5585f-cu / xg-040g-mf；纯优化版，不含 Vantage 主题与看板，默认 Argon；包含 BBR、RPS/RFS、WiFi 监管域、USB 4G/5G 驱动、EIP93 等既有优化。"
