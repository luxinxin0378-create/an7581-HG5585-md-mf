name: 构建 an7581 双机型固件

# 推送到 main 自动开始构建；也可在 Actions 页面手动触发
on:
  push:
    branches: [main]
    # 只有配置/脚本变更才重跑 ct/md；新增独立工作流不会打断正在进行的构建
    paths:
      - 'config/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

# 同一分支的新构建排队等待，不取消已在跑的长时间编译
concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.model }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false          # 一个机型失败不影响另一个继续产出
      matrix:
        include:
          - model: hg5585f-ct
            profile: fiberhome_hg5585f-ct
          - model: xg-040g-md
            profile: nokia_xg-040g-md-ubi
    env:
      FORCE_UNSAFE_CONFIGURE: "1"
    steps:
      - name: 检出本仓库（配置与脚本）
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget curl \
            libtool-bin libelf-dev device-tree-compiler ccache \
            libglib2.0-dev libpixman-1-dev intltool quilt ecj fastjar

      - name: 准备源码 / feeds / 定制 / 配置
        run: bash scripts/prepare.sh "${{ matrix.model }}" "${{ matrix.profile }}"

      - name: 下载并编译
        run: bash scripts/build.sh "${{ matrix.model }}" "${{ matrix.profile }}"

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.model }}
          path: output/${{ matrix.model }}/
          if-no-files-found: error
          retention-days: 90

      - name: 上传完整编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.model }}
          path: build-${{ matrix.model }}.log
          if-no-files-found: ignore
          retention-days: 30

  publish:
    name: 汇总发布到 Release
    needs: build
    # 只有两个机型都编译成功才发布，避免失败时生成空 Release
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: 下载两个机型的固件
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: dist
          merge-multiple: true

      - name: 列出待发布文件
        run: find dist -type f -printf '%s  %p\n' | sort -k2

      - name: 创建 Release 并上传固件
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="fw-$(date +%Y%m%d-%H%M%S)-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "an7581 固件 ${GITHUB_RUN_NUMBER}" \
            --notes "机型：hg5585f-ct / xg-040g-md（airoha/an7581）" || true
